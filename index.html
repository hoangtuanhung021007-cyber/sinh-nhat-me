<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chúc mừng sinh nhật Mẹ ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffd6e7,#fff0f5);
    min-height:100vh;
    overflow-x:hidden;
    color:#6b2145;
}

/* Khung chính */
.container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.box{
    max-width:700px;
    width:100%;
}

/* Tiêu đề */
h1{
    font-size:48px;
    margin-bottom:15px;
    animation:heartbeat 1.5s infinite;
}

.subtitle{
    font-size:21px;
    margin-bottom:35px;
    line-height:1.6;
}

/* Hộp quà */
.gift{
    width:180px;
    height:150px;
    margin:auto;
    position:relative;
    cursor:pointer;
    transition:.3s;
}

.gift:hover{
    transform:scale(1.08);
}

.gift-body{
    position:absolute;
    bottom:0;
    width:180px;
    height:120px;
    background:#e83e70;
    border-radius:10px;
}

.gift-body:after{
    content:"";
    position:absolute;
    left:75px;
    width:30px;
    height:120px;
    background:#ffd54f;
}

.gift-lid{
    position:absolute;
    top:20px;
    left:-10px;
    width:200px;
    height:45px;
    background:#f05b86;
    border-radius:10px;
    z-index:2;
}

.gift-lid:after{
    content:"";
    position:absolute;
    left:85px;
    width:30px;
    height:45px;
    background:#ffd54f;
}

.gift-text{
    margin-top:25px;
    font-size:20px;
    font-weight:bold;
}

/* Ẩn */
.hidden{
    display:none;
}

/* Khung món quà */
.gift-content{
    background:rgba(255,255,255,.93);
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 40px rgba(150,50,100,.2);
    animation:appear .7s;
}

.gift-content h2{
    font-size:30px;
    margin-bottom:20px;
}

/* ẢNH
   Không đặt width cố định.
   Ảnh sẽ giữ nguyên kích thước gốc.
*/
.gift-image{
    display:block;
    width:auto;
    height:auto;

    max-width:100%;
    margin:0 auto 20px;

    border-radius:12px;

    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

/* Lời chúc */
.gift-message{
    font-size:20px;
    line-height:1.7;
}

/* Nút */
.next-btn{
    margin-top:25px;
    padding:13px 25px;
    border:0;
    border-radius:30px;
    background:#e83e70;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.next-btn:hover{
    background:#c92859;
}

/* Tim bay */
.heart{
    position:fixed;
    bottom:-30px;
    font-size:25px;
    animation:fly 5s linear forwards;
    pointer-events:none;
}

@keyframes fly{

    0%{
        transform:translateY(0) scale(1);
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) scale(1.5);
        opacity:0;
    }

}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

}

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* Điện thoại */
@media(max-width:600px){

    h1{
        font-size:34px;
    }

    .subtitle{
        font-size:18px;
    }

    .gift-content{
        padding:22px 16px;
    }

    .gift-message{
        font-size:18px;
    }

}
</style>

</head>

<body>


<!-- NHẠC -->
<audio id="birthdayMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>


<div class="container">

<div class="box">


<!-- ========================= -->
<!-- MÀN HÌNH BAN ĐẦU -->
<!-- ========================= -->

<div id="start">

    <h1>
        🎂 Chúc mừng sinh nhật Mẹ ❤️
    </h1>

    <p class="subtitle">

        Hôm nay là một ngày thật đặc biệt...<br>

        Con có món quà nhỏ dành tặng mẹ 🎁

    </p>


    <!-- HỘP QUÀ -->

    <div class="gift" onclick="openGift()">

        <div class="gift-lid"></div>

        <div class="gift-body"></div>

    </div>


    <p class="gift-text">

        👆 Hãy ấn vào hộp quà

    </p>

</div>



<!-- ========================= -->
<!-- PHẦN QUÀ -->
<!-- ========================= -->

<div id="giftContent" class="gift-content hidden">

    <h2 id="giftTitle"></h2>


    <!-- ẢNH -->

    <div id="giftText"></div>


    <!-- NÚT -->

    <button
        class="next-btn"
        onclick="nextGift()">

        Mở món quà tiếp theo 🎁

    </button>

</div>


</div>

</div>



<script>

let currentGift = 0;



/* ========================= */
/* DANH SÁCH QUÀ */
/* ========================= */

const gifts = [

{
    title:"💐 Món quà đầu tiên",

    image:"images/me4.jpg",

    text:`

        <img
            class="gift-image"
            src="images/me4.jpg"
            alt="Ảnh kỷ niệm">

        <div class="gift-message">

            ❤️<br><br>

            Chúc mẹ sinh nhật thật vui vẻ!<br>

            Con chúc mẹ luôn mạnh khỏe,
            luôn vui vẻ và mỗi ngày đều có
            thật nhiều nụ cười ❤️💐

        </div>

    `
},



{
    title:"👩‍👦 Món quà thứ hai",

    image:"images/me3.jpg",

    text:`

        <img
            class="gift-image"
            src="images/me3.jpg"
            alt="Ảnh kỷ niệm">

        <div class="gift-message">

            Nhìn lại những bức ảnh này,
            con thấy mình đã có thật nhiều
            kỷ niệm đẹp với mẹ. ❤️

            <br><br>

            Cảm ơn mẹ vì đã luôn yêu thương,
            chăm sóc và ở bên con.

        </div>

    `
},



{
    title:"🌷 Món quà thứ ba",

    image:"images/me1.jpg",

    text:`

        <img
            class="gift-image"
            src="images/me1.jpg"
            alt="Ảnh kỷ niệm">

        <div class="gift-message">

            Con mong tuổi mới của mẹ sẽ có
            thật nhiều niềm vui và hạnh phúc.

            <br><br>

            Mong mẹ luôn khỏe mạnh,
            bình an và có thật nhiều thời gian
            vui vẻ bên gia đình.

        </div>

    `
},



{
    title:"❤️ Món quà cuối cùng",

    image:"images/me2.jpg",

    text:`

        <img
            class="gift-image"
            src="images/me2.jpg"
            alt="Ảnh kỷ niệm">

        <div class="gift-message">

            Mẹ à... ❤️

            <br><br>

            Đây chỉ là một món quà nhỏ mà con làm
            để dành tặng mẹ trong ngày sinh nhật.

            <br><br>

            Có thể con không phải lúc nào cũng nói ra,
            nhưng con luôn biết ơn mẹ vì tất cả những gì
            mẹ đã làm cho con.

            <br><br>

            <b>
                Chúc mẹ sinh nhật thật hạnh phúc!
            </b>

            <br><br>

            Con yêu mẹ rất nhiều ❤️

        </div>

    `
}

];



/* ========================= */
/* MỞ HỘP QUÀ */
/* ========================= */

function openGift(){

    /* Phát nhạc */

    const music =
        document.getElementById("birthdayMusic");

    music.volume = 0.5;

    music.play();


    /* Ẩn màn hình đầu */

    document
        .getElementById("start")
        .classList
        .add("hidden");


    /* Hiện quà */

    document
        .getElementById("giftContent")
        .classList
        .remove("hidden");


    showGift();

    createHearts();

}



/* ========================= */
/* HIỂN THỊ QUÀ */
/* ========================= */

function showGift(){

    document
        .getElementById("giftTitle")
        .innerHTML =
        gifts[currentGift].title;


    document
        .getElementById("giftText")
        .innerHTML =
        gifts[currentGift].text;


    const button =
        document.querySelector(".next-btn");


    if(currentGift === gifts.length - 1){

        button.innerHTML =
            "🎉 Chúc mừng sinh nhật Mẹ ❤️";

    }

    else{

        button.innerHTML =
            "Mở món quà tiếp theo 🎁";

    }

}



/* ========================= */
/* QUÀ TIẾP THEO */
/* ========================= */

function nextGift(){

    if(currentGift < gifts.length - 1){

        currentGift++;

        showGift();

        createHearts();

    }

    else{

        createManyHearts();

    }

}



/* ========================= */
/* TIM BAY */
/* ========================= */

function createHearts(){

    for(let i=0;i<12;i++){

        let heart =
            document.createElement("div");

        heart.className="heart";

        heart.innerHTML =
            ["❤️","💕","💗","💖","🌸"]
            [Math.floor(Math.random()*5)];


        heart.style.left =
            Math.random()*100+"vw";


        heart.style.animationDuration =
            (3+Math.random()*3)+"s";


        document.body.appendChild(heart);


        setTimeout(
            ()=>heart.remove(),
            6000
        );

    }

}



/* ========================= */
/* NHIỀU TIM Ở QUÀ CUỐI */
/* ========================= */

function createManyHearts(){

    for(let i=0;i<30;i++){

        setTimeout(
            createHearts,
            i*80
        );

    }

}

</script>

</body>
</html>
